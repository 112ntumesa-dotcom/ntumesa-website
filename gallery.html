<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NTUMESA 活動相簿回顧</title>
  
  <!-- PapaParse 用於解析 Google Sheets CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 頂部導覽列 */
    .nav-bar {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav-brand {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .home-btn {
      text-decoration: none;
      background: #f1f5f9;
      color: #334155;
      padding: 0.45rem 1rem;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .home-btn:hover {
      background: #e2e8f0;
      color: var(--primary);
    }

    /* 主內容區塊 */
    .container {
      max-width: 1200px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
      flex: 1;
      width: 100%;
    }

    .header-section {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .header-section h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 0.5rem;
    }

    .header-section p {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    /* 年份切換標籤 */
    .year-tabs {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
    }

    .year-tab {
      background: #ffffff;
      border: 1px solid var(--border);
      padding: 0.5rem 1.4rem;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .year-tab:hover, .year-tab.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    }

    /* 相簿卡片網格 */
    .albums-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.8rem;
    }

    .album-card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
    }

    .album-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
      border-color: #93c5fd;
    }

    .album-cover {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background-color: #e2e8f0;
    }

    .album-info {
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .album-meta {
      font-size: 0.82rem;
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .album-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 0.5rem;
    }

    .album-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* 燈箱視窗 (Lightbox Modal) */
    .viewer-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      z-index: 9999;
      flex-direction: column;
      overflow-y: auto;
      padding: 2rem 1.5rem;
    }

    .viewer-modal.active {
      display: flex;
    }

    .viewer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto 1.5rem auto;
      color: #ffffff;
    }

    .viewer-close-btn {
      background: #334155;
      color: #ffffff;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .viewer-close-btn:hover {
      background: #475569;
    }

    /* 相片網格 */
    .photo-masonry {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.2rem;
    }

    .photo-masonry img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      background-color: #1e293b;
    }

    .photo-masonry img:hover {
      transform: scale(1.03);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>

  <!-- 頂部導覽列 -->
  <nav class="nav-bar">
    <a href="gallery.html" class="nav-brand">📷 NTUMESA 活動相簿</a>
    <a href="index.html" class="home-btn">🏠 回系學會首頁</a>
  </nav>

  <!-- 主相簿清單 -->
  <main class="container">
    <div class="header-section">
      <h1>系學會活動相簿回顧</h1>
      <p>點選各活動相簿即可瀏覽完整精彩照片記錄</p>
    </div>

    <!-- 年份切換列 -->
    <div id="year-tabs" class="year-tabs"></div>

    <!-- 相簿展示網格 -->
    <div id="albums-grid" class="albums-grid"></div>
  </main>

  <!-- 燈箱相片展開視窗 -->
  <div id="viewer-modal" class="viewer-modal">
    <div class="viewer-header">
      <div>
        <h2 id="modal-album-title" style="font-size: 1.6rem; font-weight: 800;"></h2>
        <p id="modal-album-desc" style="color: #94a3b8; font-size: 0.95rem; margin-top: 0.25rem;"></p>
      </div>
      <button class="viewer-close-btn" onclick="closeViewer()">關閉 ✕</button>
    </div>

    <div id="photo-masonry" class="photo-masonry"></div>
  </div>

  <script>
    const GALLERY_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTx0GJyuaRNXxtHNiN750VXs5IOkjA1hdOKsEEPVB7UluLglOm_F-vsix4cMoej9egFkAAdkLQfuVTS/pub?gid=497116616&single=true&output=csv";

    let albumsData = [];
    let currentYear = "ALL";

    // 自動轉換 Google Drive 直連圖片
    function formatDriveImage(url) {
      if (!url) return '';
      const clean = url.trim();
      if (clean.includes("drive.google.com")) {
        const match = clean.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || clean.match(/[?&]id=([a-zA-Z0-9_-]+)/);
        if (match && match[1]) {
          return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1200`;
        }
      }
      return clean;
    }

    // 核心演算法：將字串轉換為標準「民國學年度數字」
    function parseAcademicYear(yearRaw, dateRaw) {
      // 1. 若 year 欄位填入純數字或有數字 (如 "114", "114學年度", "2025")
      if (yearRaw && yearRaw.trim() !== '') {
        const numMatch = yearRaw.match(/\d+/);
        if (numMatch) {
          let y = parseInt(numMatch[0], 10);
          if (y > 1900) {
            // 若為西元年 (例如 2025)，若有附帶日期則精準判斷，否則直接轉民國
            return y - 1911;
          }
          return y;
        }
      }

      // 2. 依據活動日期 (date) 精確換算學年度 (8月1日起為新學年)
      if (dateRaw && dateRaw.trim() !== '') {
        const d = new Date(dateRaw.replace(/\./g, '-').replace(/\//g, '-'));
        if (!isNaN(d.getTime())) {
          const westernYear = d.getFullYear();
          const month = d.getMonth() + 1; // 1 ~ 12
          return month >= 8 ? (westernYear - 1911) : (westernYear - 1911 - 1);
        }
      }

      return null;
    }

    function loadGalleryData() {
      const url = GALLERY_CSV_URL + (GALLERY_CSV_URL.includes('?') ? '&' : '?') + '_t=' + Date.now();

      Papa.parse(url, {
        download: true,
        header: false,
        skipEmptyLines: true,
        complete: function(results) {
          if (!results.data || results.data.length <= 1) {
            renderAlbums();
            return;
          }

          const rows = results.data.slice(1);

          albumsData = rows.map((row, index) => {
            const rawYear = (row[0] || "").trim();
            const albumName = (row[1] || "").trim() || `活動相簿 ${index + 1}`;
            const coverUrlRaw = (row[5] || "").trim();
            const photoUrlsRaw = (row[6] || "").trim();
            const date = (row[7] || "").trim();
            const description = (row[8] || "").trim();

            const photoUrls = photoUrlsRaw 
              ? photoUrlsRaw.split(",").map(u => formatDriveImage(u)).filter(Boolean) 
              : [];

            // 換算為統一學年度
            const academicYear = parseAcademicYear(rawYear, date);

            return {
              academicYear: academicYear,
              albumName,
              coverUrl: formatDriveImage(coverUrlRaw) || (photoUrls.length > 0 ? photoUrls[0] : ""),
              photoUrls,
              date,
              description
            };
          }).filter(album => album.albumName && (album.coverUrl || album.photoUrls.length > 0));

          // 將相簿由最新學年度排到最舊學年度 (由大到小)
          albumsData.sort((a, b) => (b.academicYear || 0) - (a.academicYear || 0));

          renderYearTabs();
          renderAlbums();
        },
        error: function(err) {
          console.error("CSV 下載解析失敗:", err);
          document.getElementById("albums-grid").innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 4rem; color: #ef4444;">
              讀取試算表失敗，請確認 Google Sheets 是否已發布為 CSV。
            </div>
          `;
        }
      });
    }

    function renderYearTabs() {
      const tabsContainer = document.getElementById("year-tabs");
      
      // 收集所有出現過的學年度數字，並做去重
      const yearSet = new Set();
      albumsData.forEach(a => {
        if (a.academicYear !== null) yearSet.add(a.academicYear);
      });

      // 關鍵排序：學年度由大到小排序 (最新排最前：115 -> 114 -> 113...)
      const sortedYears = Array.from(yearSet).sort((a, b) => b - a);

      tabsContainer.innerHTML = "";

      // 1. 全部年份按鈕
      const allBtn = document.createElement("button");
      allBtn.className = `year-tab ${currentYear === 'ALL' ? 'active' : ''}`;
      allBtn.textContent = "全部年份";
      allBtn.onclick = () => {
        currentYear = "ALL";
        renderYearTabs();
        renderAlbums();
      };
      tabsContainer.appendChild(allBtn);

      // 2. 依最新到最舊加入學年度按鈕
      sortedYears.forEach(year => {
        const btn = document.createElement("button");
        btn.className = `year-tab ${currentYear === String(year) ? 'active' : ''}`;
        btn.textContent = `${year} 學年度`;
        btn.onclick = () => {
          currentYear = String(year);
          renderYearTabs();
          renderAlbums();
        };
        tabsContainer.appendChild(btn);
      });
    }

    function renderAlbums() {
      const grid = document.getElementById("albums-grid");
      grid.innerHTML = "";

      const filtered = currentYear === "ALL" 
        ? albumsData 
        : albumsData.filter(a => String(a.academicYear) === String(currentYear));

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 4rem; color: #94a3b8;">目前尚無相簿資料</div>`;
        return;
      }

      filtered.forEach(album => {
        const card = document.createElement("div");
        card.className = "album-card";
        card.onclick = () => openViewer(album);

        const cover = album.coverUrl || "https://images.unsplash.com/photo-1523580494863-6f3031224c94?w=600";
        const yearTag = album.academicYear ? `${album.academicYear} 學年度` : "活動記錄";

        card.innerHTML = `
          <img src="${cover}" class="album-cover" alt="${album.albumName}" loading="lazy">
          <div class="album-info">
            <div class="album-meta">📅 ${album.date || yearTag} ｜ 共 ${album.photoUrls.length} 張相片</div>
            <h3 class="album-title">${album.albumName}</h3>
            <p class="album-desc">${album.description || '點擊瀏覽完整活動相簿。'}</p>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openViewer(album) {
      document.getElementById("modal-album-title").textContent = album.albumName;
      document.getElementById("modal-album-desc").textContent = album.description;

      const masonry = document.getElementById("photo-masonry");
      masonry.innerHTML = "";

      album.photoUrls.forEach(url => {
        const img = document.createElement("img");
        img.src = url;
        img.loading = "lazy";
        img.onclick = () => window.open(url, "_blank");
        masonry.appendChild(img);
      });

      document.getElementById("viewer-modal").classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closeViewer() {
      document.getElementById("viewer-modal").classList.remove("active");
      document.body.style.overflow = "auto";
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeViewer();
    });

    window.addEventListener("DOMContentLoaded", loadGalleryData);
  </script>
</body>
</html>
